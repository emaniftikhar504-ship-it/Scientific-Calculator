<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovCalc — Scientific Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div>
            <h1>NovCalc</h1>
            <p>Scientific Calculator</p>
        </div>

        <button id="themeBtn" class="theme-btn" title="Toggle theme">
            🌙
        </button>

    </header>


    <!-- CALCULATOR -->
    <section class="calculator">

        <!-- DISPLAY -->
        <div class="display">

            <div class="display-top">

                <span id="angleIndicator">DEG</span>

                <button id="copyBtn" class="copy-btn" title="Copy result">
                    📋
                </button>

            </div>

            <div id="expression" class="expression"></div>

            <div id="result" class="result">
                0
            </div>

        </div>


        <!-- MODE SWITCH -->
        <div class="mode-switch">

            <button id="basicModeBtn" class="mode-btn active">
                Basic
            </button>

            <button id="scientificModeBtn" class="mode-btn">
                Scientific
            </button>

        </div>


        <!-- CONTROLS -->
        <div class="controls">

            <button id="angleBtn" class="small-btn">
                DEG
            </button>

            <button id="historyToggleBtn" class="small-btn">
                🕘 History
            </button>

        </div>


        <!-- MEMORY -->
        <div class="memory-row">

            <button data-memory="clear">MC</button>
            <button data-memory="recall">MR</button>
            <button data-memory="add">M+</button>
            <button data-memory="subtract">M−</button>

        </div>


        <!-- BASIC CALCULATOR -->
        <div id="basicPad" class="button-pad">

            <button class="function-btn" data-action="clear">
                AC
            </button>

            <button class="function-btn" data-value="(">
                (
            </button>

            <button class="function-btn" data-value=")">
                )
            </button>

            <button class="operator-btn" data-value="/">
                ÷
            </button>


            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>

            <button class="operator-btn" data-value="*">
                ×
            </button>


            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>

            <button class="operator-btn" data-value="-">
                −
            </button>


            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>

            <button class="operator-btn" data-value="+">
                +
            </button>


            <button data-value="0" class="zero-btn">
                0
            </button>

            <button data-value=".">
                .
            </button>

            <button class="equals-btn" data-action="calculate">
                =
            </button>

            <button
                class="delete-btn"
                data-action="delete"
                title="Delete"
            >
                ⌫
            </button>

        </div>


        <!-- SCIENTIFIC CALCULATOR -->
        <div id="scientificPad" class="button-pad scientific-pad hidden">

            <button class="function-btn" data-value="sin(">
                sin
            </button>

            <button class="function-btn" data-value="cos(">
                cos
            </button>

            <button class="function-btn" data-value="tan(">
                tan
            </button>

            <button class="function-btn" data-value="sqrt(">
                √
            </button>


            <button class="function-btn" data-value="asin(">
                sin⁻¹
            </button>

            <button class="function-btn" data-value="acos(">
                cos⁻¹
            </button>

            <button class="function-btn" data-value="atan(">
                tan⁻¹
            </button>

            <button class="function-btn" data-value="log(">
                log
            </button>


            <button class="function-btn" data-value="ln(">
                ln
            </button>

            <button class="function-btn" data-value="avg(">
                AVG
            </button>

            <button class="function-btn" data-value="pi">
                π
            </button>

            <button class="function-btn" data-value="e">
                e
            </button>


            <button class="function-btn" data-value="^">
                xʸ
            </button>

            <button
                class="function-btn"
                data-action="square"
            >
                x²
            </button>

            <button class="function-btn" data-value="(">
                (
            </button>

            <button class="function-btn" data-value=")">
                )
            </button>


            <button class="function-btn" data-value="%">
                %
            </button>

            <button class="function-btn" data-action="clear">
                AC
            </button>

            <button
                class="delete-btn"
                data-action="delete"
            >
                ⌫
            </button>

            <button class="operator-btn" data-value="/">
                ÷
            </button>


            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>

            <button class="operator-btn" data-value="*">
                ×
            </button>


            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>

            <button class="operator-btn" data-value="-">
                −
            </button>


            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>

            <button class="operator-btn" data-value="+">
                +
            </button>


            <button data-value="0">
                0
            </button>

            <button data-value=".">
                .
            </button>

            <button class="equals-btn" data-action="calculate">
                =
            </button>

            <button class="operator-btn" data-value="+">
                +
            </button>

        </div>


        <!-- HISTORY -->
        <section id="historyPanel" class="history-panel hidden">

            <div class="history-header">

                <h3>Calculation History</h3>

                <button id="clearHistoryBtn">
                    Clear
                </button>

            </div>

            <div id="historyList" class="history-list">
                <p class="empty-history">
                    No calculations yet.
                </p>
            </div>

        </section>

    </section>


    <!-- FOOTER -->
    <footer>
        NovCalc • Built with HTML, CSS & JavaScript
    </footer>

</div>


<!-- TOAST -->
<div id="toast" class="toast"></div>


<script src="script.js"></script>

</body>
</html>
